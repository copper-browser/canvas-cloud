[package]
name = "copper-cloud-canvas"
description = "Canvases REST API and Yjs WebSocket rooms for copper-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
copper-cloud-core.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
governor.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
uuid.workspace = true
# yrs ≥ 0.18 ships the y-sync protocol (DefaultProtocol, Awareness, sync::Message) as
# `yrs::sync`; the standalone `y-sync` crate is frozen on yrs 0.17.
yrs = { version = "0.28", features = ["sync"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower.workspace = true
http-body-util.workspace = true
