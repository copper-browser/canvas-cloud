[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/engine",
  "crates/apps",
  "crates/accounts",
  "crates/mcp",
  "crates/canvas-cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/copper-browser/canvas-cloud"
homepage = "https://github.com/copper-browser/canvas-cloud"
documentation = "https://github.com/copper-browser/canvas-cloud/tree/main/docs"
authors = ["The Canvas Cloud contributors"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Shared dependency versions. Member crates use `foo = { workspace = true }` (and may add
# features on top). TLS everywhere uses rustls with the `ring` provider (no aws-lc / cmake),
# which keeps x86_64 + aarch64 cross builds simple.
[workspace.dependencies]
canvas-cloud-core = { path = "crates/core" }
canvas-cloud-engine = { path = "crates/engine" }
canvas-cloud-apps = { path = "crates/apps" }
canvas-cloud-accounts = { path = "crates/accounts" }
canvas-cloud-mcp = { path = "crates/mcp" }

anyhow = "1"
thiserror = "2"
async-stream = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
axum = { version = "0.8", features = ["macros", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.9"
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "migrate",
  "macros",
  "uuid",
  "time",
  "json",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
base64 = "0.22"
hex = "0.4"
bytes = "1"
url = "2"
# yrs ≥ 0.18 ships the y-sync protocol (DefaultProtocol, Awareness, sync::Message) as
# `yrs::sync`; the standalone `y-sync` crate is frozen on yrs 0.17.
yrs = { version = "0.28", features = ["sync"] }

# crypto
aes-gcm = { version = "0.10", features = ["std", "zeroize"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
subtle = "2"
zeroize = "1"

# tls
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "axum", "tls12", "webpki-roots"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# observability / limits
tracing = "0.1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
governor = "0.10"

# cli
clap = { version = "4", features = ["derive", "env"] }

# OIDC (accounts): id_token verification (ring backend)
jsonwebtoken = "9"

# HTTP client (OIDC discovery/token/JWKS in accounts; tests)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
# Unwind (not abort): a panic in one request/room task must not take the whole server down.
panic = "unwind"

# Never strip host artifacts (proc-macro dylibs, build scripts): stripping them corrupts the
# macOS dylibs (dyld: "mis-aligned LINKEDIT string pool") and saves nothing that ships.
[profile.release.build-override]
strip = false

# Argon2id (64 MiB) and AES-GCM are painfully slow unoptimized; keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
